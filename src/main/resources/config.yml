# ============================================================
#  XRail - Minecraft Paper/Purpur 矿车速度控制插件
# ============================================================

# 插件语言（对应 lang 文件夹中的文件名，例如 zh_cn / en_us）
language: zh_cn

# 速度显示栏（乘坐矿车时实时显示速度，保留 3 位小数）
display:
  # 是否允许使用速度显示栏（false 时所有玩家都无法开启）
  enabled: true
  # 默认显示方式: ACTIONBAR / BOSSBAR / CHAT / OFF
  default-method: ACTIONBAR
  # 显示刷新间隔（tick，1 = 每 tick 刷新最实时；最高 40，配置更大时按 40 处理）
  update-interval: 1
  # CHAT 模式的发送间隔（tick）
  chat-interval: 20

# 各类矿车的速度上限（对全服该类矿车生效，单位：格/秒）
# limit 就是该类型的最高速度：全局生效，玩家用 GUI 调整单台矿车也不能超过
# enabled = true  时限制该类矿车速度（1 ~ limit）
# enabled = false 时该类型矿车保持原版行为
# 玩家可用 GUI 把单台矿车调整到 limit 以内的任意值（存入矿车数据，随存档保存）
# 注意：命令方块矿车（COMMAND_MINECART）始终为原版，不受本插件影响
carts:
  MINECART:          # 普通矿车
    enabled: true
    limit: 25
  CHEST_MINECART:    # 箱子矿车
    enabled: true
    limit: 25
  FURNACE_MINECART:  # 动力矿车
    enabled: true
    limit: 25
  HOPPER_MINECART:   # 漏斗矿车
    enabled: true
    limit: 25
  TNT_MINECART:      # TNT 矿车
    enabled: true
    limit: 25
  SPAWNER_MINECART:  # 刷怪笼矿车
    enabled: true
    limit: 25
