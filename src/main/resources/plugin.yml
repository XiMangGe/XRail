name: XRail
main: com.ximangge.xrail.XRail
version: 26.10.30.2
api-version: '1.20'
author: XiMangGe
description: Fine-grained minecart speed control with GUI, per-type limits and live speed display.
website: https://github.com/XiMangGe/XRail

commands:
  xrail:
    description: XRail main command
    usage: /xrail help
    aliases: [xr]
    permission: xrail.use
  xrailreload:
    description: Reload XRail config, language and display settings
    usage: /xrailreload
    aliases: [xrreload]
    permission: xrail.admin

permissions:
  xrail.use:
    description: Basic command access and the cart speed GUI
    default: true
  xrail.admin:
    description: Admin commands (set speeds / vanilla / language / reload)
    default: op
  xrail.display:
    description: Use the live speed display
    default: true
