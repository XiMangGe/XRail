name: Build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download compile dependencies
        run: |
          M2="$HOME/.m2/repository"
          PAPER="https://repo.papermc.io/repository/maven-public"
          CENTRAL="https://repo1.maven.org/maven2"
          download() { mkdir -p "$(dirname "$2")"; curl -fsSL --retry 5 --retry-delay 3 -o "$2" "$1"; echo "got: $2"; }
          download "$PAPER/io/papermc/paper/paper-api/1.20.4-R0.1-SNAPSHOT/paper-api-1.20.4-R0.1-20241030.192207-176.jar" \
                   "$M2/io/papermc/paper/paper-api/1.20.4-R0.1-SNAPSHOT/paper-api-1.20.4-R0.1-SNAPSHOT.jar"
          download "$CENTRAL/net/kyori/adventure-api/4.16.0/adventure-api-4.16.0.jar" \
                   "$M2/net/kyori/adventure-api/4.16.0/adventure-api-4.16.0.jar"
          download "$CENTRAL/net/kyori/adventure-key/4.16.0/adventure-key-4.16.0.jar" \
                   "$M2/net/kyori/adventure-key/4.16.0/adventure-key-4.16.0.jar"
          download "$CENTRAL/net/kyori/examination-api/1.3.0/examination-api-1.3.0.jar" \
                   "$M2/net/kyori/examination-api/1.3.0/examination-api-1.3.0.jar"
          download "$CENTRAL/net/kyori/option/1.0.0/option-1.0.0.jar" \
                   "$M2/net/kyori/option/1.0.0/option-1.0.0.jar"
          download "$CENTRAL/net/kyori/adventure-text-serializer-legacy/4.16.0/adventure-text-serializer-legacy-4.16.0.jar" \
                   "$M2/net/kyori/adventure-text-serializer-legacy/4.16.0/adventure-text-serializer-legacy-4.16.0.jar"
          download "$CENTRAL/org/jetbrains/annotations/24.1.0/annotations-24.1.0.jar" \
                   "$M2/org/jetbrains/annotations/24.1.0/annotations-24.1.0.jar"
          download "$CENTRAL/com/google/guava/guava/32.1.2-jre/guava-32.1.2-jre.jar" \
                   "$M2/com/google/guava/guava/32.1.2-jre/guava-32.1.2-jre.jar"
          download "$CENTRAL/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar" \
                   "$M2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar"
          download "$PAPER/net/md-5/bungeecord-chat/1.20-R0.2-deprecated%2Bbuild.18/bungeecord-chat-1.20-R0.2-deprecated%2Bbuild.18.jar" \
                   "$M2/net/md-5/bungeecord-chat/1.20-R0.2-deprecated+build.18/bungeecord-chat-1.20-R0.2-deprecated+build.18.jar"

      - name: Build (version from tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: XRAIL_VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Build (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XRail-jar
          path: dist/*.jar

      - name: Attach jar to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
